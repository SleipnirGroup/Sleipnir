name: Python

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  wheel-windows-x86_64:
    name: Windows x86_64
    uses: ./.github/workflows/python-wheel.yml
    with:
      name: Windows x86_64
      os: windows-2025

  wheel-windows-aarch64:
    name: Windows aarch64
    uses: ./.github/workflows/python-wheel.yml
    with:
      name: Windows aarch64
      os: windows-11-arm

  wheel-linux-x86_64:
    name: Linux x86_64
    uses: ./.github/workflows/python-wheel.yml
    with:
      name: Linux x86_64
      os: ubuntu-24.04

  wheel-linux-aarch64:
    name: Linux aarch64
    uses: ./.github/workflows/python-wheel.yml
    with:
      name: Linux aarch64
      os: ubuntu-24.04-arm

  wheel-macos-universal:
    name: macOS universal
    uses: ./.github/workflows/python-wheel.yml
    with:
      name: macOS universal
      os: macos-15

  mypy:
    name: mypy
    runs-on: ubuntu-24.04
    needs: [wheel-linux-x86_64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'Linux x86_64 wheel'

      - run: pip install --group dev dist/sleipnirgroup_jormungandr-*.whl
        shell: bash
      - run: mypy
      - name: mypy (stubs)
        run: |
          args=(
            --warn-unused-ignores
            # Comparison operators deliberately return constraints instead of
            # bool
            --disable-error-code override
            # Indexing returns a Real for int indices and a RealSubmatrix otherwise
            --disable-error-code overload-overlap
            # The bindings have int overloads alongside float ones so ints
            # dispatch without a conversion pass, but type checkers promote int
            # to float
            --disable-error-code overload-cannot-match
            -p sleipnir._sleipnir
          )
          mypy "${args[@]}"
        shell: bash

  build-sdist:
    name: sdist
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # https://github.com/actions/checkout/issues/882
      - run: git fetch --tags --force origin

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - run: python ./tools/update_version.py
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      - run: python ./tools/update_version.py --release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

      - run: pip install build
      - run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-24.04
    needs:
      - wheel-windows-x86_64
      - wheel-windows-aarch64
      - wheel-linux-x86_64
      - wheel-linux-aarch64
      - wheel-macos-universal
      - build-sdist
    if: github.repository_owner == 'SleipnirGroup' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: pypi
      url: https://pypi.org/p/sleipnirgroup-jormungandr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '* wheel'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'sdist'
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
